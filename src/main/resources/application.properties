spring.application.name=sistema-taqueria
server.port=${PORT:8080}
# Lee el archivo .env de la carpeta desde donde se inicia el sistema (si existe). Ver .env.example
spring.config.import=optional:file:.env[.properties]

# ---------- Base de datos PostgreSQL ----------
# Las credenciales se leen de variables de entorno (ver .env.example). No escriba contrasenas aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taqueria}
spring.datasource.username=${DB_USER:taqueria}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Archivos subidos (logotipo, fotos, comprobantes de gastos) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
taqueria.uploads-dir=${UPLOADS_DIR:./uploads}

# ---------- Regionalizacion ----------
taqueria.zona-horaria=America/El_Salvador
spring.jackson.time-zone=America/El_Salvador
spring.jackson.serialization.write-dates-as-timestamps=false
# Si es false, no se puede vender un producto cuando faltan ingredientes en inventario
taqueria.permitir-venta-sin-existencias=${PERMITIR_VENTA_SIN_EXISTENCIAS:false}

# ---------- Datos de demostracion (opcionales) ----------
# Se cargan solo si la base esta vacia y esta variable vale true.
taqueria.demo.cargar=${CARGAR_DEMO:false}
taqueria.demo.password=${DEMO_PASSWORD:}

# ---------- Sesiones ----------
server.servlet.session.timeout=10h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.name=TAQUERIA_SESION
server.error.include-stacktrace=never
server.error.include-message=never
