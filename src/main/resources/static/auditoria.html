<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditoría</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/auditoria.js"></script>
</head>
<body>
<div id="vista">
<section class="tarjeta">
    <div class="tarjeta-cuerpo pb-2">
        <form class="row g-2 align-items-end" id="filtros">
            <div class="col-md-4"><label class="form-label small mb-1" for="q">Buscar</label><input class="form-control form-control-sm" id="q" name="q" placeholder="Acción, usuario o detalle"></div>
            <div class="col-6 col-md-3"><label class="form-label small mb-1" for="desde">Desde</label><input class="form-control form-control-sm" type="date" id="desde" name="desde"></div>
            <div class="col-6 col-md-3"><label class="form-label small mb-1" for="hasta">Hasta</label><input class="form-control form-control-sm" type="date" id="hasta" name="hasta"></div>
            <div class="col-md-2"><button class="btn btn-sm btn-primary w-100" type="submit"><i class="bi bi-search"></i> Buscar</button></div>
        </form>
        <div class="small text-secondary mt-2">Registro de operaciones importantes: inicios de sesión, ventas, anulaciones, cambios de precios, permisos, inventario y caja. No se puede modificar desde el sistema.</div>
    </div>
    <div class="tabla-contenedor"><table class="table table-sm">
        <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Registro</th><th>Detalle</th><th>IP</th></tr></thead>
        <tbody id="filas"></tbody></table></div>
    <div class="paginacion" id="pie"></div>
</section>
</div>
</body>
</html>
