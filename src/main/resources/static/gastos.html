<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gastos</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/gastos.js"></script>
</head>
<body>
<div id="vista">
<div class="alert alert-secondary small d-flex gap-2"><i class="bi bi-info-circle"></i>
    <div>Aquí van los <strong>gastos de operación</strong> (gas, luz, agua, alquiler, sueldos, limpieza...). Las compras de ingredientes se registran en
    <a href="/compras.html">Compras</a> porque aumentan el inventario.</div></div>
<div class="row g-3">
    <div class="col-lg-9">
        <section class="tarjeta">
            <div class="tarjeta-cuerpo pb-2">
                <form class="row g-2 align-items-end" id="filtros">
                    <div class="col-6 col-md-3"><label class="form-label small mb-1" for="f-desde">Desde</label><input class="form-control form-control-sm" type="date" id="f-desde" name="desde"></div>
                    <div class="col-6 col-md-3"><label class="form-label small mb-1" for="f-hasta">Hasta</label><input class="form-control form-control-sm" type="date" id="f-hasta" name="hasta"></div>
                    <div class="col-8 col-md-3"><label class="form-label small mb-1" for="f-categoria">Categoría</label><select class="form-select form-select-sm" id="f-categoria" name="categoriaId"></select></div>
                    <div class="col-4 col-md-1"><button class="btn btn-sm btn-primary w-100" type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button></div>
                    <div class="col-md-2 text-end"><button class="btn btn-sm btn-primary gestionar" id="nuevo" type="button"><i class="bi bi-plus-lg"></i> Nuevo gasto</button></div>
                </form>
            </div>
            <div class="tabla-contenedor"><table class="table table-hover">
                <thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th>Pago</th><th>Comprobante</th><th>Registró</th><th class="num">Monto</th><th></th></tr></thead>
                <tbody id="filas"></tbody>
                <tfoot><tr><th colspan="6" class="text-end">Total (sin anulados)</th><th class="num" id="total"></th><th></th></tr></tfoot></table></div>
        </section>
    </div>
    <div class="col-lg-3">
        <section class="tarjeta mb-3"><div class="tarjeta-titulo"><i class="bi bi-pie-chart"></i> Por categoría</div><div class="tarjeta-cuerpo" id="por-categoria"></div></section>
        <section class="tarjeta"><div class="tarjeta-titulo"><i class="bi bi-tags"></i> Categorías de gasto
            <button class="btn btn-sm btn-outline-primary ms-auto" id="nueva-categoria" type="button" aria-label="Nueva categoría"><i class="bi bi-plus"></i></button></div>
            <ul class="list-group list-group-flush" id="categorias"></ul></section>
    </div>
</div>
</div>
</body>
</html>
