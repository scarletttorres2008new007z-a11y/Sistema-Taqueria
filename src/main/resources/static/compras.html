<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compras</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/compras.js"></script>
</head>
<body>
<div id="vista">
<ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-compras" type="button" role="tab">Compras</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-deudas" type="button" role="tab" id="pestana-deudas">Deudas con proveedores</button></li>
</ul>
<div class="tab-content">
    <section class="tab-pane fade show active tarjeta" id="tab-compras" role="tabpanel">
        <div class="tarjeta-cuerpo pb-2">
            <form class="row g-2 align-items-end" id="filtros">
                <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-desde">Desde</label><input class="form-control form-control-sm" type="date" id="f-desde" name="desde"></div>
                <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-hasta">Hasta</label><input class="form-control form-control-sm" type="date" id="f-hasta" name="hasta"></div>
                <div class="col-8 col-md-3"><label class="form-label small mb-1" for="f-proveedor">Proveedor</label><select class="form-select form-select-sm" id="f-proveedor" name="proveedorId"></select></div>
                <div class="col-4 col-md-1"><button class="btn btn-sm btn-primary w-100" type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button></div>
                <div class="col-md-4 text-end"><button class="btn btn-sm btn-primary" id="nueva" type="button"><i class="bi bi-plus-lg"></i> Nueva compra</button></div>
            </form>
            <div class="small text-secondary mt-2">Sin fechas se muestran los últimos 60 días. Al <strong>recibir</strong> una compra, sus artículos entran al inventario (una sola vez).</div>
        </div>
        <div class="tabla-contenedor"><table class="table table-hover">
            <thead><tr><th>Compra</th><th>Fecha</th><th>Proveedor</th><th>Factura</th><th class="num">Total</th><th class="num">Saldo</th><th>Recepción</th><th>Pago</th><th></th></tr></thead>
            <tbody id="filas"></tbody></table></div>
    </section>
    <section class="tab-pane fade" id="tab-deudas" role="tabpanel"><div id="deudas"></div></section>
</div>
</div>
</body>
</html>
