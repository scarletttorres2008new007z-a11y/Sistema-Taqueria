<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de cocina</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/cocina.js"></script>
</head>
<body>
<div id="vista">
<div class="d-flex flex-wrap align-items-center gap-3 mb-3">
    <span class="conexion" id="conexion"></span>
    <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="sonido" checked>
        <label class="form-check-label" for="sonido">Sonido al llegar un pedido</label>
    </div>
    <span class="small text-secondary ms-auto">Los pedidos aparecen solos; no necesita recargar la página.</span>
</div>
<div class="tablero-cocina">
    <section class="columna-cocina"><h2><i class="bi bi-hourglass-split"></i> Pendientes <span class="badge text-bg-warning" id="n-PENDIENTE">0</span></h2><div id="col-PENDIENTE"></div></section>
    <section class="columna-cocina"><h2><i class="bi bi-fire"></i> En preparación <span class="badge text-bg-primary" id="n-EN_PREPARACION">0</span></h2><div id="col-EN_PREPARACION"></div></section>
    <section class="columna-cocina"><h2><i class="bi bi-check2-circle"></i> Listos para entregar <span class="badge text-bg-success" id="n-LISTO">0</span></h2><div id="col-LISTO"></div></section>
</div>
</div>
</body>
</html>
