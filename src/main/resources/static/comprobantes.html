<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comprobantes</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/comprobantes.js"></script>
</head>
<body>
<div id="vista">
<div class="alert alert-secondary small d-flex gap-2"><i class="bi bi-info-circle"></i>
    <div>Estos son <strong>comprobantes internos</strong> de venta. No son documentos tributarios electrónicos (DTE) ni sustituyen
    a la factura autorizada por el Ministerio de Hacienda. Vea el estado de la facturación electrónica en Configuración.</div></div>
<section class="tarjeta">
    <div class="tarjeta-cuerpo pb-2">
        <form class="row g-2 align-items-end" id="filtros">
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-numero">Comprobante o venta</label>
                <input class="form-control form-control-sm" id="f-numero" name="numero" placeholder="CI-00000001 o V-000001"></div>
            <div class="col-6 col-md-3"><label class="form-label small mb-1" for="f-cliente">Cliente</label>
                <input class="form-control form-control-sm" id="f-cliente" name="cliente"></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-estado">Estado</label>
                <select class="form-select form-select-sm" id="f-estado" name="estado"><option value="">Todos</option>
                    <option value="VIGENTE">Vigente</option><option value="ANULADO">Anulado</option></select></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-desde">Desde</label>
                <input class="form-control form-control-sm" type="date" id="f-desde" name="desde"></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-hasta">Hasta</label>
                <input class="form-control form-control-sm" type="date" id="f-hasta" name="hasta"></div>
            <div class="col-6 col-md-1 d-flex gap-1">
                <button class="btn btn-sm btn-primary flex-grow-1" type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button></div>
        </form>
        <div class="small text-secondary mt-2" id="nota"></div>
    </div>
    <div class="tabla-contenedor">
        <table class="table table-hover">
            <thead><tr><th>Número</th><th>Fecha de emisión</th><th>Venta</th><th>Cliente</th><th class="num">Total</th><th>Estado</th><th class="num">Impresiones</th><th></th></tr></thead>
            <tbody id="filas"></tbody>
        </table>
    </div>
    <div class="paginacion" id="pie"></div>
</section>
</div>
</body>
</html>
