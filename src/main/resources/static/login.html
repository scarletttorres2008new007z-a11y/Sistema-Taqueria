<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/login.js"></script>
</head>
<body>
<main class="pantalla-acceso">
    <div class="caja-acceso">
        <div class="tarjeta">
            <div class="tarjeta-cuerpo p-4">
                <div class="logo" id="logo"><i class="bi bi-shop" aria-hidden="true"></i></div>
                <h1 class="h4 text-center mb-1" id="negocio">Sistema de la taquería</h1>
                <p class="text-center text-secondary small mb-4">Ingrese con su usuario de empleado</p>
                <div class="alert alert-warning small d-none" id="aviso-demo">
                    Este sistema tiene <strong>datos de demostración</strong>. No son datos reales del negocio.
                </div>
                <form id="form-acceso" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="usuario">Usuario</label>
                        <input class="form-control form-control-lg" id="usuario" name="username" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="clave">Contraseña</label>
                        <div class="input-group">
                            <input class="form-control form-control-lg" id="clave" name="password" type="password" autocomplete="current-password" required>
                            <button class="btn btn-outline-secondary" type="button" id="ver-clave" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="alert alert-danger small d-none" id="error" role="alert"></div>
                    <button class="btn btn-primary btn-lg w-100" type="submit" id="btn-entrar">Entrar</button>
                </form>
            </div>
        </div>
        <p class="text-center small mt-3" style="color:#d9d1c7">¿Olvidó su contraseña? Pida al administrador que la restablezca.</p>
    </div>
</main>
</body>
</html>
