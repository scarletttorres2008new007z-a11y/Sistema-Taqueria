<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos</title>
    <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/pedidos.js"></script>
</head>
<body>
<div id="vista">
<div class="row g-3 mb-3" id="resumen"></div>
<section class="tarjeta">
    <div class="tarjeta-cuerpo pb-2">
        <form class="barra-filtros row g-2 align-items-end" id="filtros">
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-numero">Número</label>
                <input class="form-control form-control-sm" id="f-numero" name="numero" placeholder="P-000001"></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-estado">Estado</label>
                <select class="form-select form-select-sm" id="f-estado" name="estado">
                    <option value="">Todos</option><option value="PENDIENTE">Pendiente</option><option value="EN_PREPARACION">En preparación</option>
                    <option value="LISTO">Listo para entregar</option><option value="ENTREGADO">Entregado</option><option value="CANCELADO">Cancelado</option></select></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-tipo">Tipo</label>
                <select class="form-select form-select-sm" id="f-tipo" name="tipo">
                    <option value="">Todos</option><option value="LOCAL">Local</option><option value="LLEVAR">Para llevar</option><option value="DOMICILIO">Domicilio</option></select></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-desde">Desde</label>
                <input class="form-control form-control-sm" type="date" id="f-desde" name="desde"></div>
            <div class="col-6 col-md-2"><label class="form-label small mb-1" for="f-hasta">Hasta</label>
                <input class="form-control form-control-sm" type="date" id="f-hasta" name="hasta"></div>
            <div class="col-6 col-md-2 d-flex gap-1">
                <button class="btn btn-sm btn-primary flex-grow-1" type="submit"><i class="bi bi-search"></i> Buscar</button>
                <button class="btn btn-sm btn-outline-secondary" type="reset" title="Limpiar filtros" aria-label="Limpiar filtros"><i class="bi bi-x-lg"></i></button></div>
        </form>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="conexion" id="conexion"></span>
            <a class="btn btn-sm btn-primary" href="/tomar-pedido.html" id="btn-nuevo"><i class="bi bi-plus-lg"></i> Nuevo pedido</a>
        </div>
    </div>
    <div class="tabla-contenedor">
        <table class="table table-hover">
            <thead><tr><th>Número</th><th>Fecha</th><th>Tipo</th><th>Mesa / cliente</th><th class="num">Total</th><th>Estado</th><th>Venta</th><th></th></tr></thead>
            <tbody id="filas"></tbody>
        </table>
    </div>
    <div class="paginacion" id="pie"></div>
</section>
</div>
</body>
</html>
