# Base de datos exclusiva para pruebas: se BORRA y se vuelve a crear en cada ejecucion.
# Nunca apunte DB_TEST_URL a la base de datos de produccion.
spring.datasource.url=${DB_TEST_URL:jdbc:postgresql://localhost:5432/taqueria_test}
spring.datasource.username=${DB_USER:taqueria}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.clean-disabled=false
taqueria.uploads-dir=${java.io.tmpdir}/taqueria-pruebas
taqueria.demo.cargar=false
logging.level.root=WARN
logging.level.com.taqueria=INFO
